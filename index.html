<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>売上ログ</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="売上ログ">
<meta name="theme-color" content="#16181c">
<style>
  /* ==========================================================
     重要な固定仕様(今後変更しないこと):
     - 入力画面(#inputScreen)は絶対にスクロールさせない。1画面に完結させる。
     - 新しい項目を追加する場合は、既存の行の高さ・余白を削ってでも
       画面内に収めること。安易に縦方向を増やさない。
     ========================================================== */
  :root{
    --bg:#16181c;
    --panel:#1e2126;
    --line:#33373d;
    --accent:#e0793c;
    --text:#eceef0;
    --muted:#8a8f96;
    --red:#d6534a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,'Hiragino Sans',sans-serif;
    display:flex;
    justify-content:center;
    overflow:hidden;
  }
  .app{
    width:100%; max-width:420px;
    height:100vh;
    padding:10px 14px 12px;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex:0 0 auto; }
  header h1{ font-size:15px; font-weight:600; margin:0; letter-spacing:0.02em; }
  .badge{
    display:flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:5px 11px;
    font-size:12.5px; color:var(--muted);
    cursor:pointer;
  }
  .badge b{ color:var(--accent); font-size:13.5px; }

  .row{ margin-bottom:7px; flex:0 0 auto; }
  .row-label{ font-size:10.5px; color:var(--muted); margin-bottom:4px; letter-spacing:0.02em; }
  input[type="date"]{
    width:100%; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; color:var(--text); font-size:14px; padding:8px 10px;
    height:40px;
  }

  .chips{ display:flex; flex-wrap:nowrap; gap:6px; }
  .chip{
    border:2px solid transparent; border-radius:9px; font-size:13px; font-weight:600;
    text-align:center; cursor:pointer; user-select:none;
    flex:1 1 0; min-width:0; opacity:0.42; transition:opacity 0.12s;
    height:44px; display:flex; align-items:center; justify-content:center;
  }
  .chip.active{ opacity:1; border-color:var(--accent); }
  .chip:active{ transform:scale(0.96); }

  /* 商品カラー */
  .c-gry{ background:#aeb1b6; color:#1a1a1a; }
  .c-blk{ background:#1c1c1c; color:#f0f0f0; }

  /* ステータスカラー(シート配色に合わせる) */
  .c-stat1{ background:#3d3d3d; color:#fff; }
  .c-stat2{ background:#e9c468; color:#4a3400; }
  .c-stat3{ background:#f3b48f; color:#5a2c0e; }
  .c-stat4{ background:#a3252a; color:#fff; }

  .chip.discount{ background:var(--panel); border:2px solid var(--line); color:var(--muted); opacity:0.55; }
  .chip.discount.active{ background:#3a2e22; border-color:var(--accent); color:var(--text); opacity:1; }

  /* 販路: アプリアイコンそのものの形のボタン */
  .channel-row{ display:flex; gap:18px; justify-content:center; align-items:center; }
  .app-icon-btn{
    width:54px; height:54px; padding:0; flex:0 0 auto;
    opacity:0.38; cursor:pointer; background:none; border:none;
    transition:opacity 0.15s, filter 0.15s;
    display:flex; align-items:center; justify-content:center;
  }
  .app-icon-btn.active{
    opacity:1;
    filter:drop-shadow(0 0 0 2px var(--accent)) drop-shadow(0 0 6px rgba(224,121,60,0.7));
  }
  .app-icon-btn img{ width:100%; height:100%; object-fit:contain; display:block; }
  .app-icon-btn:active{ transform:scale(0.94); }

  .actions{ display:flex; gap:8px; margin-top:auto; padding-top:8px; flex:0 0 auto; }
  .btn{ flex:1; border:none; border-radius:10px; height:48px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-add{ background:var(--panel); border:1px solid var(--accent); color:var(--accent); }
  .btn-send{ background:var(--accent); color:#20130a; }
  .btn:active{ transform:scale(0.98); }

  .toast{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(10px);
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:10px 16px; border-radius:8px; font-size:13px;
    opacity:0; transition:opacity 0.2s, transform 0.2s;
    pointer-events:none; max-width:90%; text-align:center; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .screen{ display:none; flex-direction:column; flex:1; height:100vh; }
  .screen.show{ display:flex; }
  #inputScreen{ overflow:hidden; }
  #previewScreen{ overflow:hidden; }

  .preview-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex:0 0 auto; }
  .preview-head h2{ font-size:15px; margin:0; }
  .back-link{ font-size:13px; color:var(--muted); cursor:pointer; }

  .item-list{ flex:1; overflow-y:auto; min-height:0; }
  .item-card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:9px 11px; margin-bottom:7px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .item-info{ font-size:12.5px; line-height:1.45; }
  .item-info .d1{ color:var(--muted); font-size:10.5px; }
  .item-icons{ display:flex; gap:8px; flex-shrink:0; }
  .icon-btn{
    width:28px; height:28px; border-radius:6px; border:1px solid var(--line);
    background:transparent; color:var(--muted); font-size:13px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn.del{ color:var(--red); border-color:#5a2c28; }

  .empty-msg{ text-align:center; color:var(--muted); font-size:13px; margin-top:30px; }
  .confirm-note{ font-size:11.5px; color:var(--muted); text-align:center; margin:6px 0 4px; flex:0 0 auto; }
</style>
</head>
<body>

  <div class="screen show" id="inputScreen">

      <h1>売上ログ</h1>
      <div class="badge" id="openPreviewBtn">📋 <b id="pendingCount">0</b>件</div>

    <div class="row">
      <div class="row-label">ステータス</div>
      <div class="chips" id="statusChips">
        <div class="chip c-stat1" data-value="発注確認中">確認</div>
        <div class="chip c-stat2" data-value="発送準備中">未発</div>
        <div class="chip c-stat3" data-value="評価待ち">待ち</div>
        <div class="chip c-stat4 active" data-value="取引完了">完了</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-add" id="addBtn">＋ 追加</button>
      <button class="btn btn-send" id="goPreviewBtn">送信</button>
    </div>
  </div>

  <div class="screen" id="previewScreen">
    <div class="preview-head">
      <h2>内容確認</h2>
      <span class="back-link" id="backBtn">← 戻る</span>
    </div>

    <div class="item-list" id="itemList"></div>
    <div class="empty-msg" id="emptyMsg" style="display:none;">まだ何も追加されていません</div>

    <div class="confirm-note">この内容で送信します</div>
    <div class="actions">
      <button class="btn btn-add" id="backBtn2">戻って編集</button>
      <button class="btn btn-send" id="confirmSendBtn">この内容で送信する</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const SIMULATE_MODE = false;
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxzzaTi6rQaQJw47rLfFquFBn8E2PaYsVILGR4oxrvij9dMEduFbxZWFHDjbWQG9AQT/exec";

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

const PRODUCT_DISPLAY = {
  "SMS-JB64-05-GRY":"64-GRY", "SMS-JB64-05-BLK":"64-BLK",
  "SMS-JB74-05-GRY":"74-GRY", "SMS-JB74-05-BLK":"74-BLK",
  "SHK-01-BLK":"SHK"
};
const CHANNEL_LABELS = { "Amazon":"Amazon", "メルカリ":"メルカリ", "ヤフーフリマ":"ヤフー", "Base":"Base" };
const STATUS_LABELS = { "発注確認中":"確認","発送準備中":"未発","評価待ち":"待ち","取引完了":"完了" };

let pendingList = [];
let idSeq = 1;

const el = id => document.getElementById(id);
const dateInput = el('dateInput');
const productChips = el('productChips');
const discountChips = el('discountChips');
const channelChips = el('channelChips');
const statusChips = el('statusChips');
const pendingCountEl = el('pendingCount');
const toastEl = el('toast');

let selected = { product:null, discount:'-', channel:null, status:'取引完了' };

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
dateInput.value = todayStr();

function setupChips(container, key){
  container.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-value]');
    if(!chip) return;
    container.querySelectorAll('[data-value]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    selected[key] = chip.dataset.value;
  });
}
setupChips(productChips, 'product');
setupChips(discountChips, 'discount');
setupChips(channelChips, 'channel');
setupChips(statusChips, 'status');

function showToast(msg, ms=1600){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
}

function validate(){
  if(!selected.product) return '商品名を選んでください';
  if(!selected.channel) return '販路を選んでください';
  if(!selected.status) return 'ステータスを選んでください';
  return null;
}

function resetSelectionKeepDate(){
  selected.product = null;
  selected.discount = '-';
  productChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  discountChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  discountChips.querySelector('[data-value="-"]').classList.add('active');
}

function addCurrentToList(){
  const err = validate();
  if(err){ showToast(err); return false; }
  pendingList.push({
    id: idSeq++,
    date: dateInput.value,
    product: selected.product,
    discount: selected.discount,
    channel: selected.channel,
    status: selected.status
  });
  updateBadge();
  return true;
}

function updateBadge(){ pendingCountEl.textContent = pendingList.length; }

el('addBtn').addEventListener('click', () => {
  if(addCurrentToList()){
    showToast('追加しました');
    resetSelectionKeepDate();
  }
});

function renderPreview(){
  const list = el('itemList');
  const empty = el('emptyMsg');
  list.innerHTML = '';
  if(pendingList.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  pendingList.forEach(item => {
    const md = item.date.slice(5).replace('-','/');
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `
      <div class="item-info">
        <div class="d1">${md}</div>
        <div>${PRODUCT_DISPLAY[item.product]||item.product} / ${item.discount} / ${CHANNEL_LABELS[item.channel]||item.channel} / ${STATUS_LABELS[item.status]||item.status}</div>
      </div>
      <div class="item-icons">
        <button class="icon-btn edit" data-id="${item.id}">✎</button>
        <button class="icon-btn del" data-id="${item.id}">×</button>
      </div>`;
    list.appendChild(card);
  });
}

el('itemList').addEventListener('click', (e) => {
  const editBtn = e.target.closest('.edit');
  const delBtn = e.target.closest('.del');
  if(editBtn){
    const id = Number(editBtn.dataset.id);
    const item = pendingList.find(x => x.id === id);
    if(!item) return;
    pendingList = pendingList.filter(x => x.id !== id);
    loadIntoForm(item);
    showScreen('input');
  } else if(delBtn){
    const id = Number(delBtn.dataset.id);
    pendingList = pendingList.filter(x => x.id !== id);
    updateBadge();
    renderPreview();
  }
});

function loadIntoForm(item){
  dateInput.value = item.date;
  selected = { product:item.product, discount:item.discount, channel:item.channel, status:item.status };
  [[productChips,item.product],[discountChips,item.discount],[channelChips,item.channel],[statusChips,item.status]]
    .forEach(([container,val]) => {
      container.querySelectorAll('[data-value]').forEach(c => c.classList.toggle('active', c.dataset.value === val));
    });
}

function showScreen(name){
  el('inputScreen').classList.toggle('show', name === 'input');
  el('previewScreen').classList.toggle('show', name === 'preview');
  if(name === 'preview'){ renderPreview(); updateBadge(); }
}

el('openPreviewBtn').addEventListener('click', () => showScreen('preview'));
el('backBtn').addEventListener('click', () => showScreen('input'));
el('backBtn2').addEventListener('click', () => showScreen('input'));

el('goPreviewBtn').addEventListener('click', () => {
  const err = validate();
  if(!err){
    addCurrentToList();
    resetSelectionKeepDate();
  } else if(pendingList.length === 0){
    showToast(err);
    return;
  }
  showScreen('preview');
});

el('confirmSendBtn').addEventListener('click', () => {
  if(pendingList.length === 0){ showToast('送信する内容がありません'); return; }

  if(SIMULATE_MODE){
    showToast(`(デモ)${pendingList.length}件送信しました。実際にはまだ送信されていません`, 2600);
    pendingList = [];
    updateBadge();
    showScreen('input');
    return;
  }

  const items = pendingList.map(({date,product,discount,channel,status}) => ({date,product,discount,channel,status}));
  const url = WEB_APP_URL + '?items=' + encodeURIComponent(JSON.stringify(items));
  window.open(url, '_blank');
  pendingList = [];
  updateBadge();
  showScreen('input');
  showToast('送信しました。結果は新しいタブでご確認ください');
});
</script>
</body>
</html>
